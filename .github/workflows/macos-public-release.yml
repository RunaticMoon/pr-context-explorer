name: macOS public binary release
on:
  push:
    branches: [feat/public-updates]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full reviewed SHA, exactly the selected branch dispatch SHA'
        type: string
        required: true
      tag:
        description: 'NEW stable vMAJOR.MINOR.PATCH matching package.json'
        type: string
        required: true
      approve_public_release:
        description: 'Approve PUBLIC binary publication after all gates (false = validation only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: macos-public-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'RunaticMoon/pr-context-explorer' && github.event.repository.private == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/public-updates')
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      release-tag: ${{ steps.version.outputs.tag }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PRCE_PACKAGED_CI: '1'
      PRCE_PUBLIC_UPDATE_CI: '1'
      PRCE_PUBLIC_UPDATE_OLD_VERSION: '0.5.99'
    steps:
      - name: Require exact reviewed source and Mac15 Apple Silicon runner
        timeout-minutes: 1
        env:
          APPROVED_SHA: ${{ inputs.commit || github.sha }}
        run: |
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15
          test -z "${PUBLIC_RELEASE_TOKEN:-}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Version and full regression gates
        id: version
        timeout-minutes: 15
        run: |
          if [ -z "$RELEASE_TAG" ]; then export RELEASE_TAG="v$(node -p "require('./package.json').version")"; fi
          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          python3 distribution/release.py version "$RELEASE_TAG" package.json
          npm ci
          npm install --prefix .tools/ai-clis --ignore-scripts --package-lock=false --no-audit --no-fund @openai/codex@0.154.0 @anthropic-ai/claude-code@2.1.270
          chmod 0755 .tools/ai-clis/node_modules/@openai/codex-darwin-arm64/vendor/aarch64-apple-darwin/bin/codex .tools/ai-clis/node_modules/@anthropic-ai/claude-code-darwin-arm64/claude
          npm run desktop:prepare
          npm test
          npm run test:desktop
          npm run desktop:smoke
          npm run build
      - name: Build ad-hoc public packages without publisher credentials
        timeout-minutes: 15
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run desktop:dist:mac -- --publish never -c.directories.output=release -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false '-c.artifactName=PR-Context-Explorer-${version}-${arch}.${ext}'
          python3 distribution/check-unsigned.py release
          node --test tests/e2e/desktop-runtime.mjs
          python3 distribution/public-manifest.py generate release
          version=$(node -p "require('./package.json').version")
          export PRCE_DESKTOP_ZIP="$GITHUB_WORKSPACE/release/PR-Context-Explorer-${version}-arm64.zip"
          npm run desktop:smoke:packaged
          # Required real two-version update + rollback acceptance; missing script FAILS.
          export PRCE_PUBLIC_UPDATE_ZIP="$PRCE_DESKTOP_ZIP"
          export PRCE_PUBLIC_UPDATE_MANIFEST="$GITHUB_WORKSPACE/release/public-mac.json"
          npm run test:public-update:mac
          python3 distribution/public-manifest.py verify release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: artifact
        with:
          name: public-macos-arm64-${{ github.sha }}
          path: |
            release/*.zip
            release/*.dmg
            release/public-mac.json
          if-no-files-found: error
          retention-days: 7
  macos26-install:
    name: Mac26 same immutable Mac15 ZIP — install, runtime and updater
    needs: build
    runs-on: macos-26
    timeout-minutes: 20
    env:
      PRCE_PACKAGED_CI: '1'
      PRCE_PUBLIC_UPDATE_CI: '1'
      PRCE_PUBLIC_UPDATE_OLD_VERSION: '0.5.99'
      RELEASE_TAG: ${{ needs.build.outputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          digest-mismatch: error
      - name: Prepare only test driver and verify actual OS
        timeout-minutes: 4
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test -z "${PUBLIC_RELEASE_TOKEN:-}"
          npm ci --ignore-scripts
      - name: Validate and install final Mac15 ZIP, then real update acceptance
        timeout-minutes: 15
        run: |
          version=$(node -p "require('./package.json').version")
          export PRCE_DESKTOP_ZIP="$GITHUB_WORKSPACE/release/PR-Context-Explorer-${version}-arm64.zip"
          test -f "$PRCE_DESKTOP_ZIP"
          python3 distribution/public-manifest.py verify release
          npm run desktop:smoke:packaged
          export PRCE_PUBLIC_UPDATE_ZIP="$PRCE_DESKTOP_ZIP"
          export PRCE_PUBLIC_UPDATE_MANIFEST="$GITHUB_WORKSPACE/release/public-mac.json"
          npm run test:public-update:mac
          python3 distribution/public-manifest.py verify release
  publish:
    needs: [build, macos26-install]
    if: inputs.approve_public_release == true && github.repository == 'RunaticMoon/pr-context-explorer' && github.event.repository.private == true && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: public-release
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          digest-mismatch: error
      - name: Audit, draft, download readback and public promotion
        timeout-minutes: 12
        env:
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          APPROVE_PUBLIC_RELEASE: ${{ inputs.approve_public_release }}
        run: bash distribution/publish-public.sh
# No Apple credentials, source upload, logs, caches or latest-mac.yml publication.
# public-release is restricted to main; required reviewers are not configured.
# Explicit approved dispatch and successful Mac gates authorize publication.
# PUBLIC_RELEASE_TOKEN is injected ONLY in the publisher step, never build/test.
