name: macOS personal unsigned release
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full reviewed commit SHA, exactly the selected branch dispatch SHA'
        type: string
        required: true
      tag:
        description: 'NEW stable vMAJOR.MINOR.PATCH matching package.json'
        type: string
        required: true
      promote:
        description: 'Publish verified draft to the personal unsigned channel'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: macos-production-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'RunaticMoon/pr-context-explorer' && github.event.repository.private == true && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/apple-silicon-desktop')
    environment: personal-release
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PRCE_PACKAGED_CI: '1'
    steps:
      - name: Require reviewed exact source and Apple Silicon runner
        timeout-minutes: 1
        env:
          APPROVED_SHA: ${{ inputs.commit }}
        run: |
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          test "$(uname -m)" = arm64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Version and regression gates
        timeout-minutes: 10
        run: |
          python3 distribution/release.py version "$RELEASE_TAG" package.json
          npm ci
          npm install --prefix .tools/ai-clis --ignore-scripts --package-lock=false --no-audit --no-fund @openai/codex@0.154.0 @anthropic-ai/claude-code@2.1.270
          chmod 0755 .tools/ai-clis/node_modules/@openai/codex-darwin-arm64/vendor/aarch64-apple-darwin/bin/codex .tools/ai-clis/node_modules/@anthropic-ai/claude-code-darwin-arm64/claude
          npm run desktop:prepare
          npm test
          npm run test:desktop
          npm run desktop:smoke
          npm run build
      - name: Build personal ad-hoc packages, never signed updater metadata
        timeout-minutes: 10
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run desktop:dist:mac -- --publish never -c.directories.output=release -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false '-c.artifactName=PR-Context-Explorer-${version}-${arch}.${ext}'
          python3 distribution/check-unsigned.py release
          npm run desktop:smoke:packaged
          node --test tests/e2e/desktop-runtime.mjs
          python3 distribution/personal-manifest.py release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: artifact
        with:
          name: personal-macos-arm64-${{ github.sha }}
          path: |
            release/*.zip
            release/*.dmg
            release/personal-mac.json
          if-no-files-found: error
          retention-days: 7
  macos26-install:
    name: macOS 26 installed Mac15 ZIP — GUI/runtime only, not AI compatibility
    needs: build
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # GitHub-hosted ephemeral account; smoke refuses existing application data.
      PRCE_PACKAGED_CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          digest-mismatch: error
      - name: Prepare test driver only and report actual OS version
        timeout-minutes: 4
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          npm ci --ignore-scripts
      - name: Install final ZIP outside checkout and launch bundled runtime
        timeout-minutes: 5
        run: |
          version=$(node -p "require('./package.json').version")
          export PRCE_DESKTOP_ZIP="$GITHUB_WORKSPACE/release/PR-Context-Explorer-${version}-arm64.zip"
          test -f "$PRCE_DESKTOP_ZIP"
          npm run desktop:smoke:packaged
  publish:
    needs: [build, macos26-install]
    if: github.repository == 'RunaticMoon/pr-context-explorer' && github.event.repository.private == true && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/apple-silicon-desktop')
    environment: personal-release
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          digest-mismatch: error
      - name: Draft, read-back verification and optional personal promotion
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE: ${{ inputs.promote }}
        run: bash distribution/publish-personal.sh
# No Apple account, Apple secrets, notarization or latest-mac.yml publication.
